<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero lab 2D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #10221a; overflow: hidden; font-family: Manrope, system-ui, sans-serif; color: #f2f1ea; }
      .hero { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
      .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .copy { position: absolute; left: 7.5vw; top: 31vh; width: 44vw; }
      .stack { display: grid; }
      .stack > * { grid-area: 1 / 1; }
      .headline { margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-size: clamp(44px, 6.7vw, 104px); line-height: 1.04; letter-spacing: -0.005em; }
      .headline em { color: #c9d8b0; }
      .sub { margin: 4.2vh 0 0; font-size: clamp(14px, 1.05vw, 17px); color: #cdd3cb; }
      .cta { position: absolute; left: 7.5vw; top: calc(85.5vh - clamp(20px, 2.1vw, 30px)); display: inline-flex; align-items: center; gap: 12px; height: clamp(40px, 4.2vw, 60px); padding: 0 4px 0 1.6vw; border-radius: 999px; background: #f2f1ea; color: #14261e; font-size: clamp(10px, .95vw, 14px); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; }
      .cta i { display: grid; place-items: center; width: clamp(32px, 3.3vw, 50px); aspect-ratio: 1; border-radius: 50%; background: #14261e; color: #f2f1ea; font-style: normal; }
      .foot { position: absolute; left: 7.5vw; right: 6.6vw; bottom: 0; height: 12vh; font-size: clamp(9px, .85vw, 12px); letter-spacing: .1em; text-transform: uppercase; color: #cdd3cb; }
      .chapter { position: absolute; right: 4.9vw; top: 1.6vh; }
      .track { position: absolute; left: 0; right: 0; top: 5vh; height: 1px; background: rgba(201, 216, 176, .25); }
      .fill { position: absolute; left: 0; right: 0; top: -1px; height: 3px; border-radius: 3px; background: #c9d8b0; transform: scaleX(0); transform-origin: left; will-change: transform; }
      .headline, .sub, .cta { will-change: opacity, transform; }
      .grain { position: absolute; inset: -160px; pointer-events: none; opacity: .045; mix-blend-mode: overlay; animation: grain 1s steps(6) infinite; will-change: transform; }
      @keyframes grain { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(96px, 64px, 0); } }
      @media (prefers-reduced-motion: reduce) { .grain { animation: none; } }
      .labels { position: absolute; left: 0; right: 0; top: 7.6vh; display: flex; justify-content: space-between; font-size: clamp(8px, .72vw, 11px); color: #a9bba6; }
      .bar { position: fixed; left: 16px; top: 12px; display: flex; gap: 10px; align-items: center; color: #c9d8b0; font-size: 11px; z-index: 5; }
      .bar input { width: 320px; accent-color: #c9d8b0; }
      .bar button { background: #1f3a2e; color: #f2f1ea; border: 1px solid #3b5e4c; border-radius: 999px; padding: 4px 10px; font: inherit; cursor: pointer; }
      body.still .bar { display: none; }
    </style>
  </head>
  <body>
    <section class="hero" aria-label="Green Tree Agency">
      <canvas id="c" aria-hidden="true"></canvas>
      <div class="grain" id="grain" aria-hidden="true"></div>
      <div class="copy">
        <div class="stack">
          <h1 class="headline" id="hA">Brands aren't<br />built overnight.<br /><em>They're grown.</em></h1>
          <p class="headline" id="hB" aria-hidden="true">Every ring<br /><em>tells a story</em><br />of growth.</p>
        </div>
        <div class="stack">
          <p class="sub" id="sA">Strategy. Creativity. Measurable growth.</p>
          <p class="sub" id="sB" aria-hidden="true">From strong roots to lasting impact.</p>
        </div>
      </div>
      <a class="cta" id="cta" href="#contact">Let's grow together <i aria-hidden="true">↗</i></a>
      <div class="foot">
        <span class="chapter" id="chapter">01 / From seed to canopy</span>
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="labels"><span>Strategy / Creative / Performance</span><span>Scroll to explore</span></div>
      </div>
    </section>
    <div class="bar">
      <button id="play" type="button">Pause</button>
      <input id="scrub" type="range" min="0" max="14" step="0.01" value="0" aria-label="Time" />
      <span id="time">0.00s</span>
    </div>
    <script type="module" src="/src/hero-lab/main2d.ts"></script>
  </body>
</html>
